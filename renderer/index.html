<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C0E11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <title>GymTrack</title>
  <link rel="icon" href="logo.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><img src="logo.svg" alt="" width="34" height="34"><span>Gym<b>Track</b></span></div>
      <nav id="nav" aria-label="Μενού"></nav>
    </aside>
    <main class="main">
      <div id="update-banner" class="update-banner hidden"></div>
      <div id="page" class="page"></div>
    </main>
  </div>
  <div id="rest" class="rest" aria-live="polite"></div>
  <div id="modal" class="modal"></div>
  <div id="toast" class="toast" role="status"></div>

  <!-- Η σειρά μετράει: τα αρχεία μοιράζονται τις ίδιες μεταβλητές -->
  <script src="js/defaults.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/today.js"></script>
  <script src="js/pages/workout.js"></script>
  <script src="js/pages/food.js"></script>
  <script src="js/pages/progress.js"></script>
  <script src="js/pages/shop.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/update.js"></script>
  <script src="js/web.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
